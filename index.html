<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فرع الملاك | أسئلة القداس</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0b14;--panel:#151526;--panel2:#1d1d32;--text:#f5f3ff;--muted:#b7b4ce;--accent:#a78bfa;--accent2:#7c3aed;--good:#86efac;--bad:#fca5a5;--border:#33324d}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at top,#21163e 0%,var(--bg) 55%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
    .wrap{max-width:900px;margin:auto;padding:28px 16px 60px}
    header{text-align:center;margin:12px 0 28px}
    .logo {
  display: inline-block;
  width: 150px;
  height: 126.5625px;
  object-fit: contain;
  vertical-align: middle;
  flex-shrink: 0;
}
    .subtitle{color:var(--muted);margin:0}
    .layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(240px,.7fr);gap:16px}
    .card{background:#151526ed;border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:0 18px 45px #0002}
    h2{font-size:19px;margin:0 0 14px}
    label{display:block;color:var(--muted);font-size:14px;margin:13px 0 6px}
    input{width:100%;border:1px solid var(--border);background:#0e0e1b;color:var(--text);padding:13px 14px;border-radius:12px;font:inherit;outline:none}
    input:focus{border-color:var(--accent)}
    button{border:0;border-radius:12px;padding:12px 15px;font:inherit;font-weight:750;cursor:pointer;transition:transform .12s,opacity .12s}
    button:hover{transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .primary{width:100%;margin-top:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}
    .secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
    .row{display:flex;gap:9px}.row>*{flex:1}
    .status{min-height:24px;margin:10px 0 0;font-size:14px;color:var(--muted)}.status.good{color:var(--good)}.status.bad{color:var(--bad)}
    .hint{color:var(--muted);font-size:13px;margin-top:12px}
    .hidden{display:none!important}
    .pill{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--border);background:#0e0e1b;padding:6px 10px;border-radius:999px;color:var(--muted);font-size:13px}
    .leader-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #2b2a40}.leader-row:last-child{border:0}
    .rank{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);font-weight:800}
    .leader-name{flex:1;overflow-wrap:anywhere}.score{font-weight:800;color:#c4b5fd}
    .quiz-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}
    .timer{font-variant-numeric:tabular-nums;color:#ddd6fe;font-weight:800;background:#312451;padding:8px 12px;border-radius:12px;white-space:nowrap}
    .progress{height:6px;background:#302d45;border-radius:99px;overflow:hidden;margin:12px 0 22px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
    .question{direction:rtl;text-align:right;font-size:22px;font-weight:750;line-height:1.3;margin:12px 0 18px}
    .option{direction:rtl;text-align:right;display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:14px;margin:9px 0;background:#1b1b30;color:var(--text);border:1px solid var(--border);border-radius:13px;font-weight:500}
    .option.selected{border-color:var(--accent);background:#2a2145}.option .letter{display:grid;place-items:center;min-width:30px;height:30px;border-radius:9px;background:#30304a;font-weight:800}
    .quiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
    .result{text-align:center;padding:20px 0}.result-score{font-size:52px;line-height:1.2;font-weight:900;color:#c4b5fd;margin:10px}
    #reader{width:100%;margin-top:12px;overflow:hidden;border-radius:12px}
    #reviewBox{direction:rtl;text-align:right;margin-top:16px}
    .review-sum{font-weight:800;margin:0 0 12px;color:#ddd6fe}
    .review-q{background:#1b1b30;border:1px solid var(--border);border-radius:16px;padding:14px;margin:12px 0}
    .review-title{font-weight:750;line-height:1.5;margin-bottom:8px}
    .review-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:7px 0;border:1px solid var(--border);border-radius:12px;background:#151526;color:var(--muted)}
    .review-opt .letter{display:grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:#30304a;font-weight:800;color:var(--text)}
    .review-opt .txt{flex:1;overflow-wrap:anywhere}
    .review-opt .tag{font-size:12px;font-weight:800;white-space:nowrap}
    .review-opt.correct{border-color:var(--good);background:#12301f;color:#d1fae5}
    .review-opt.correct .tag{color:var(--good)}
    .review-opt.wrong{border-color:var(--bad);background:#3a1a20;color:#fee2e2}
    .review-opt.wrong .tag{color:var(--bad)}
    .review-note{font-size:13px;color:var(--bad);margin-top:6px}
    footer{text-align:center;color:#77748e;font-size:12px;margin-top:24px}
    @media(max-width:720px){.layout{grid-template-columns:1fr}.wrap{padding-top:18px}.card{padding:18px}.question{font-size:20px}}
  </style>
</head>
<body>

  <header>
    <img

    <h1>فرع الملاك</h1>
    <p class="subtitle">اختبر معلوماتك عن القداس القبطي</p>
  </header>

  <div class="layout">
    <main class="card">
      <section id="entry">
        <h2>ابدأ الاختبار</h2>
        <p class="subtitle" id="sessionTitle">جارٍ تحميل الاختبار…</p>
        <label for="studentId">الاسم</label>
        <input id="studentId" autocomplete="off" maxlength="60" placeholder="اكتب اسمك هنا">
        <button id="startBtn" class="primary" type="button">ابدأ الاختبار</button>
        <p id="entryStatus" class="status" role="status"></p>
        <p class="hint">/معاك 10 دقائق تحل فيهم الاسئلة فركز فالوقت برضو.</p>
      </section>

      <section id="quiz" class="hidden">
        <div class="quiz-head">
          <span class="pill" id="questionCounter">السؤال 1</span>
          <span class="timer" id="timer">00:00</span>
        </div>
        <div class="progress"><div id="progressBar"></div></div>
        <div id="questionText" class="question"></div>
        <div id="options"></div>
        <div class="quiz-actions">
          <button id="prevBtn" class="secondary" type="button">السابق</button>
          <button id="nextBtn" class="primary" style="width:auto;margin:0" type="button">التالي</button>
          <button id="submitBtn" class="primary hidden" style="width:auto;margin:0" type="button">تسليم الإجابات</button>
        </div>
        <p id="quizStatus" class="status" role="status"></p>
      </section>

      <section id="result" class="hidden result">
        <span class="pill">انتهى الاختبار</span>
        <h2 style="margin-top:18px">نتيجتك</h2>
        <div id="resultScore" class="result-score">0/5</div>
        <p id="resultMessage" class="subtitle"></p>
        <button id="reviewBtn" class="secondary" style="width:100%;margin-top:14px" type="button">اعرف غلطاتك</button>
        <div id="reviewBox" class="hidden"></div>
        <button id="againBtn" class="primary" type="button">العودة للبداية</button>
      </section>
    </main>

    <aside class="card">
      <h2>لوحة المتصدرين</h2>
      <p class="subtitle" id="leaderboardSubtitle">أعلى النتائج في هذا الاختبار</p>
      <div id="leaderboard"><p class="status">جارٍ تحميل النتائج…</p></div>
      <button id="refreshBtn" class="secondary" style="width:100%;margin-top:14px" type="button">تحديث النتائج</button>
    </aside>
  </div>
  <footer><h2>فرع الملاك بيحبك</h2>

  </footer>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let attemptId = null;
  let questions = [];
  let answers = {};
  let currentIndex = 0;
  let deadline = 0;
  let timerInterval = null;
    let busy = false;
  let reviewData = null;

  function setStatus(id, message, type = "") {
    const el = $(id);
    el.textContent = message || "";
    el.className = "status " + type;
  }
  function showSection(id) {
    ["entry", "quiz", "result"].forEach(section => $(section).classList.toggle("hidden", section !== id));
  }
  // رابط الـ Web app من Apps Script (ينتهي بـ /exec)
  const API_URL = "https://script.google.com/macros/s/AKfycbyqTUIa3o0BFIAPOKbMshLxKvnLff8Zmc5VGTHupoOQAZhBON8TaaO9nj7qbQrmVKj-/exec";

  async function callServer(method, ...args) {
    if (API_URL.includes("PASTE_YOUR")) throw new Error("لازم تحط رابط الـ Web App (ينتهي بـ /exec) في متغير API_URL.");
    let res;
    try {
      res = await fetch(API_URL, {
        method: "POST",
        // text/plain علشان المتصفح ما يبعتش preflight (Apps Script مش بيدعمه)
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ method: method, args: args })
      });
    } catch (e) {
      throw new Error("تعذر الاتصال بالخادم. تأكد من الإنترنت وحاول مرة أخرى.");
    }
    let data;
    try { data = await res.json(); }
    catch (e) { throw new Error("رد غير متوقع من الخادم. تأكد أن النشر على Anyone وأنه أحدث نسخة."); }
    if (data && data.__error) throw new Error(data.__error);
    return data;
  }
  async function loadInfo() {
    try {
      const info = await callServer("getPublicInfo");
      $("sessionTitle").textContent = info.sessionTitle + " · " + info.questionCount + " سؤال";
      $("leaderboardSubtitle").textContent = "أعلى النتائج · " + info.sessionTitle;
    } catch (e) {
      $("sessionTitle").textContent = "تعذر تحميل بيانات الاختبار.";
      setStatus("entryStatus", e.message, "bad");
    }
  }
  async function startQuiz() {
    if (busy) return;
    const id = $("studentId").value.trim();
    if (id.length < 2) return setStatus("entryStatus", "اكتب اسمك أولًا.", "bad");
    busy = true;
    $("startBtn").disabled = true;
    setStatus("entryStatus", "جارٍ فتح الاختبار…");
    try {
      const result = await callServer("startQuiz", id);
      if (!result.success) {
        setStatus("entryStatus", result.message, "bad");
        return;
      }
      attemptId = result.attemptId;
      questions = result.questions;
      answers = {};
      currentIndex = 0;
      deadline = Date.now() + result.durationSeconds * 1000;
      showSection("quiz");
      renderQuestion();
      clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 250);
      updateTimer();
    } catch (e) {
      setStatus("entryStatus", e.message, "bad");
    } finally {
      busy = false;
      $("startBtn").disabled = false;
    }
  }
  function renderQuestion() {
    const q = questions[currentIndex];
    $("questionCounter").textContent = `السؤال ${currentIndex + 1} من ${questions.length}`;
    $("progressBar").style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
    $("questionText").textContent = q.text;
    $("options").replaceChildren();
    q.options.forEach((option, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "option" + (answers[q.id] === option.id ? " selected" : "");
      const letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = String.fromCharCode(65 + i);
      const label = document.createElement("span");
      label.textContent = option.text;
      button.append(letter, label);
      button.addEventListener("click", () => {
        answers[q.id] = option.id;
        renderQuestion();
      });
      $("options").appendChild(button);
    });
    $("prevBtn").disabled = currentIndex === 0;
    $("nextBtn").classList.toggle("hidden", currentIndex === questions.length - 1);
    $("submitBtn").classList.toggle("hidden", currentIndex !== questions.length - 1);
    setStatus("quizStatus", "");
  }
  function updateTimer() {
    const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    const minutes = String(Math.floor(remaining / 60)).padStart(2, "0");
    const seconds = String(remaining % 60).padStart(2, "0");
    $("timer").textContent = `${minutes}:${seconds}`;
    if (remaining <= 0) {
      clearInterval(timerInterval);
      submitQuiz(true);
    }
  }
  async function submitQuiz(auto = false) {
    if (busy || !attemptId) return;
    busy = true;
    $("submitBtn").disabled = true;
    setStatus("quizStatus", auto ? "انتهى الوقت. جارٍ حفظ إجاباتك…" : "جارٍ تسليم الإجابات…");
    try {
      const result = await callServer("submitQuiz", attemptId, answers);
      clearInterval(timerInterval);
      if (!result.success) {
        setStatus("quizStatus", result.message, "bad");
        return;
      }
      reviewData = { questions: questions.slice(), answers: Object.assign({}, answers), correct: result.correct || {} };
      resetReview();
      attemptId = null;
      $("resultScore").textContent = `${result.score}/${result.maxScore}`;
      $("resultMessage").textContent = result.message;
      showSection("result");
      await loadLeaderboard();
    } catch (e) {
      setStatus("quizStatus", e.message + " لم يتم تأكيد حفظ إجاباتك.", "bad");
    } finally {
      busy = false;
      $("submitBtn").disabled = false;
    }
  }
  function resetReview() {
    $("reviewBox").replaceChildren();
    $("reviewBox").classList.add("hidden");
    $("reviewBtn").textContent = "اعرف غلطاتك";
  }
  function renderReview() {
    const box = $("reviewBox");
    box.replaceChildren();
    if (!reviewData) return;
    const { questions: qs, answers: ans, correct } = reviewData;
    let wrong = 0;
    const cards = qs.map((q, qi) => {
      const chosen = ans[q.id] == null ? "" : String(ans[q.id]);
      const right = correct[q.id] == null ? "" : String(correct[q.id]);
      if (chosen !== right) wrong++;
      const card = document.createElement("div");
      card.className = "review-q";
      const title = document.createElement("div");
      title.className = "review-title";
      title.textContent = (qi + 1) + ". " + q.text;
      card.appendChild(title);
      q.options.forEach((o, i) => {
        const row = document.createElement("div");
        row.className = "review-opt";
        const letter = document.createElement("span");
        letter.className = "letter";
        letter.textContent = String.fromCharCode(65 + i);
        const txt = document.createElement("span");
        txt.className = "txt";
        txt.textContent = o.text;
        const tag = document.createElement("span");
        tag.className = "tag";
        if (String(o.id) === right) {
          row.classList.add("correct");
          tag.textContent = chosen === right ? "إجابتك ✓" : "الإجابة الصحيحة ✓";
        } else if (String(o.id) === chosen) {
          row.classList.add("wrong");
          tag.textContent = "إجابتك ✗";
        }
        row.append(letter, txt, tag);
        card.appendChild(row);
      });
      if (!chosen) {
        const note = document.createElement("div");
        note.className = "review-note";
        note.textContent = "لم تجب على هذا السؤال.";
        card.appendChild(note);
      }
      return card;
    });
    const sum = document.createElement("p");
    sum.className = "review-sum";
    sum.textContent = wrong === 0 ? "ممتاز! مفيش أي أخطاء 🎉" : "عدد الأسئلة الغلط: " + wrong + " من " + qs.length;
    box.append(sum, ...cards);
  }
  function toggleReview() {
    const box = $("reviewBox");
    if (box.classList.contains("hidden")) {
      renderReview();
      box.classList.remove("hidden");
      $("reviewBtn").textContent = "إخفاء الإجابات";
      box.scrollIntoView({ behavior: "smooth", block: "start" });
    } else {
      resetReview();
    }
  }
  async function loadLeaderboard() {
    $("leaderboard").innerHTML = '<p class="status">جارٍ تحميل النتائج…</p>';
    try {
      const result = await callServer("getLeaderboard");
      $("leaderboard").replaceChildren();
      if (!result.entries.length) {
        const empty = document.createElement("p");
        empty.className = "status";
        empty.textContent = "لا توجد نتائج بعد. كن أول المشاركين!";
        $("leaderboard").appendChild(empty);
        return;
      }
      result.entries.forEach((entry, index) => {
        const row = document.createElement("div");
        row.className = "leader-row";
        const rank = document.createElement("span");
        rank.className = "rank";
        rank.textContent = index + 1;
        const name = document.createElement("span");
        name.className = "leader-name";
        name.textContent = entry.displayName;
        const score = document.createElement("span");
        score.className = "score";
        score.textContent = entry.score;
        row.append(rank, name, score);
        $("leaderboard").appendChild(row);
      });
    } catch (e) {
      $("leaderboard").innerHTML = "";
      const p = document.createElement("p");
      p.className = "status bad";
      p.textContent = e.message;
      $("leaderboard").appendChild(p);
    }
  }
  $("startBtn").addEventListener("click", startQuiz);
  $("prevBtn").addEventListener("click", () => { if (currentIndex > 0) { currentIndex--; renderQuestion(); } });
  $("nextBtn").addEventListener("click", () => { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } });
  $("submitBtn").addEventListener("click", () => submitQuiz(false));
  $("refreshBtn").addEventListener("click", loadLeaderboard);
  $("reviewBtn").addEventListener("click", toggleReview);
  $("againBtn").addEventListener("click", () => {
    clearInterval(timerInterval);
    $("studentId").value = "";
    reviewData = null;
    resetReview();
    showSection("entry");
    setStatus("entryStatus", "");
    loadLeaderboard();
  });
  $("studentId").addEventListener("keydown", (e) => { if (e.key === "Enter") startQuiz(); });
  window.addEventListener("beforeunload", (e) => { if (attemptId) { e.preventDefault(); e.returnValue = ""; } });
  loadInfo();
  loadLeaderboard();
</script>
</body>
</html>
